name: SG admission GitHub read diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sg-admission-read-check
  cancel-in-progress: false
jobs:
  read-check:
    if: github.repository == 'zyzuoyang/sg-capture-runner' || github.repository == '287113535qq-cmyk/sg-capture-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Validate two fresh admission reads with the actual job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/runner-v2/ag-rolling/sg-github-read-check.mjs
