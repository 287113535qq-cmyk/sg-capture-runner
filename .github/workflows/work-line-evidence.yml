name: SG read-only work-line evidence
on:
  workflow_dispatch:
    inputs:
      evidence_scope:
        description: Fixed read-only historical evidence; never source or maintenance
        type: choice
        options: ['pyramids-history', 'mansion-repair', 'inca-repair']
        default: 'pyramids-history'
permissions:
  contents: read
concurrency:
  group: sg-readonly-work-line-evidence
  cancel-in-progress: false
jobs:
  export:
    if: ${{ (github.repository == '287113535qq-cmyk/sg-capture-runner' && inputs.evidence_scope != 'mansion-repair') || (github.repository == 'zyzuoyang/sg-capture-runner' && inputs.evidence_scope == 'mansion-repair') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      SG_WORK_LINE_EVIDENCE_SCOPE: ${{ inputs.evidence_scope || 'pyramids-history' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked independent XML verifier dependencies
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Configure existing restricted read transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Checkout fixed encrypted evidence uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02
          path: .local/pinned-upload-artifact
          persist-credentials: false
      - name: Verify existing evidence and exercise incremental encrypted publication without source
        uses: ./.github/actions/capture-with-evidence
        with:
          mode: readonly-export
