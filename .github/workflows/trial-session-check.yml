name: SG single-game existing session readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sg-real-single-game-trial
  cancel-in-progress: false
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked protocol parser
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check existing demo session with one INIT and no BET
        env:
          SG_TRIAL_DEMO_CONFIG: ${{ secrets.SG_TRIAL_DEMO_CONFIG }}
        run: node scripts/trial/session-check.mjs
