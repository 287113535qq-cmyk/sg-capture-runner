name: SG own Crystal natural free evidence only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sg-own-crystal-natural-free-evidence-v12
  cancel-in-progress: false
jobs:
  evidence:
    if: ${{ github.repository == '287113535qq-cmyk/sg-capture-runner' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked XML parser
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Own client route, independent Python, and single-use evidence safety tests
        run: |
          node --test scripts/trial/crystal-free-evidence/route.test.mjs scripts/trial/crystal-free-evidence/probe.test.mjs
          python3 scripts/trial/crystal-free-evidence/test_route.py
      - name: Single fresh bounded demo observation without database access or collection credit
        env:
          SG_TRIAL_DEMO_CONFIG: ${{ secrets.SG_TRIAL_DEMO_CONFIG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/trial/crystal-free-evidence/probe.mjs
      - name: Preserve only encrypted raw evidence and non-sensitive summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crystal-natural-free-evidence-v12
          path: |
            .local/crystal-free-evidence/evidence.jsonl.enc
            .local/crystal-free-evidence/summary.json
          retention-days: 7
          if-no-files-found: warn
