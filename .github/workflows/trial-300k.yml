name: SG ordinary round-one capture
on:
  workflow_dispatch:
    inputs:
      allocation:
        description: 'Dynamic batches for a configured new trial, or the preserved legacy trial'
        default: round-one
        type: choice
        options: [round-one, dynamic, legacy-fixed]
      round_one_limit:
        description: 'Per-worker first-round validation limit; 0 runs the authorized campaign'
        default: '0'
        type: choice
        options: ['0', '10']
      round_limit:
        description: 'Legacy per-shard limit only; dynamic mode uses the configured global target'
        required: true
        default: '100'
        type: choice
        options: ['1', '100', '1000', '300000']
      active_shards:
        description: 'Configured capture sessions; available first-round workers start independently'
        default: '20'
        type: choice
        options: ['2', '4', '20']
      role:
        description: 'Capture, audit, status, or isolated 20-runner readiness check (no SG/SSH)'
        default: capture
        type: choice
        options: [demon-one-recover, demon-one-validate, demon-one-formal, demon-queue-recover, demon-queue-validate, demon-queue-formal, demon-two-recover, demon-two-validate, demon-two-formal, demon-three-recover, demon-three-validate, demon-three-formal, capture, pending-first-short, audit, status, runner-check, mongo-only-check, github-migrate, github-recover, github-activate, github-validate, github-promote, optimization-short, optimization-validate, optimization-formal, incident-recover, incident-validate, incident-formal, protocol-recover, protocol-validate, protocol-formal, session-recover, session-validate, session-formal, terminal-recover, terminal-validate, terminal-formal, foam-session-recover, foam-session-validate, foam-session-formal, pick-bonus-recover, pick-bonus-validate, pick-bonus-formal, pick-claim-recover, pick-claim-validate, pick-claim-formal, pick-session-recover, pick-session-validate, pick-session-formal, demon-rebind-recover, demon-rebind-validate, demon-rebind-formal, demon-session-recover, demon-session-validate, demon-session-formal, demon-feature-session-recover, demon-feature-session-validate, demon-feature-session-formal, demon-pending-session-recover, demon-pending-session-validate, demon-pending-session-formal]
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: sg-real-single-game-trial
  cancel-in-progress: false
env:
  SG_TRIAL_PLAN: ${{ (inputs.allocation || vars.SG_TRIAL_ALLOCATION || 'legacy-fixed') == 'dynamic' && 'config/trial-pool.json' || 'config/trial-300k.json' }}
