  demon-one-control:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.role, 'demon-one-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked offline parser dependency
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Recover exact902 and preserve original1706 with an independent incident receipt
