name: SG single-game source readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sg-real-single-game-trial
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked browser dependencies
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check a fresh demo launch without starting a paid round
        run: node scripts/trial/source-check.mjs
