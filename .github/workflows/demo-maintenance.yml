name: Isolated demo maintenance without source requests
on:
  workflow_dispatch:
    inputs:
      window_peer_profile:
        description: 'Read-only window audit with an independently pinned healthy peer'
        type: choice
        default: none
        options: [none, count-window-peer-rhino-pyramids-20261001.json]
      ended_source_run:
        description: 'Exact ended run id:attempt for AG parking only; no source permission'
        type: string
        default: ''
      runtime_profile:
        description: 'Reviewed healthy-run runtime update without additional quota'
        type: choice
        default: none
        options: [none, count-runtime-rhino-ag-dispatchfix-20261001.json, count-runtime-rhino-ag-continuation-entryfix-20261001.json, count-runtime-rhino-ag-continuation-20261001.json, count-runtime-rhino-continuous-20261001.json, count-runtime-rhino-two-observation-20261001.json, count-runtime-rhino-measurement-20261001.json, count-runtime-pearl-observation-20261001.json, count-runtime-pyramids-session-20261001.json]
      formal_profile:
        description: Independent reviewed complete-count profile
        type: choice
        default: formal-count-pearl-20260930.json
        options: [formal-sessions-pearl-two-20261001.json, formal-sessions-pearl-four-20261001.json, formal-sessions-rhino-two-20261001.json, formal-sessions-rhino-four-20261001.json, formal-count-pyramids-20261001.json, formal-count-pearl-20260930.json, formal-count-rhino-20261001.json, formal-count-rhino-guarantee-20261001.json]
      repair_profile:
        description: 'Independent reviewed repair permission; old profiles remain frozen'
        type: choice
        default: formal-repair-pearl-20260930.json
        options: [formal-repair-pyramids-major-entryfix-20261001.json, formal-repair-pyramids-major-20261001.json, formal-repair-pyramids-continuation-20261001.json, formal-repair-pyramids-display-20261001.json, formal-repair-pyramids-coins-20261001.json, formal-repair-pearl-20260930.json, formal-repair-pearl-awards-20261001.json]
      retire_profile:
        description: 'Exact stopped-count retirement; grants no source requests'
        type: choice
        default: formal-retire-pearl-20260930.json
        options: [formal-retire-pyramids-continuation-entryfix-20261001.json, formal-retire-pyramids-continuation-20261001.json, formal-retire-pyramids-display-entryfix-20261001.json, formal-retire-pyramids-display-20261001.json, formal-retire-pyramids-coins-20261001.json, formal-retire-pearl-20260930.json, formal-retire-pearl-repair-20260930.json]
      pilot_profile:
        description: 'Independent finite next-game profile; applied profiles remain frozen'
        type: choice
        default: demo-pilot-morepuff-20260930.json
        options: [demo-repair-rhino-guarantee-20261001.json, demo-pilot-pyramids-20261001.json, demo-pilot-inca-20261001.json, demo-repair-mansion-20261001.json, demo-repair-piggies-20261001.json, demo-repair-morepuff-20261001.json, demo-pilot-rhino-20261001.json, demo-pilot-pearl-20260930.json, demo-pilot-morepuff-20260930.json, demo-pilot-mansion-20260930.json, demo-pilot-piggies-20260930.json]
      operation:
        type: choice
        options: [revoke-rhino-jobless, close-count-shared, review-count-window, finalize-ended-source, activate-session-layout, amend-pyramids-zero-runtime, retire-pyramids-repair, activate-pyramids-repair, refresh-count-runtime, activate-pyramids-count, secondary-next, secondary-close-interrupted, secondary-idle, close-count-network, rollover, retire-finished, residual, next-game, close-pilot, close-interrupted-pilot, close-reviewed-adapter-stop, rebind-zero-source, activate-formal-count, amend-formal-runtime, retire-stopped-formal, activate-formal-repair]
        default: rollover
permissions:
  contents: read
  actions: read
concurrency:
  group: sg-demo-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.repository == 'zyzuoyang/sg-capture-runner' && inputs.operation != 'close-count-shared' && inputs.operation != 'revoke-rhino-jobless'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
      SG_DEMO_PILOT_PROFILE: demo-pilot-replacement-20260930.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked parser dependency
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Verify settled observation window through existing bounded native reads
        if: inputs.operation == 'review-count-window'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ inputs.formal_profile }}
          SG_WINDOW_SOURCE_RUN: ${{ inputs.ended_source_run }}
          SG_COUNT_WINDOW_PEER_PROFILE: ${{ inputs.window_peer_profile != 'none' && inputs.window_peer_profile || '' }}
        run: node scripts/runner-v2/count-window-review-control.mjs
      - name: Close reviewed unknown count request without replay or new source permission
        if: inputs.operation == 'close-count-network'
        run: node scripts/runner-v2/count-network-close-control.mjs
      - name: Activate reviewed session layout only after a healthy natural run boundary
        if: inputs.operation == 'activate-session-layout'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ inputs.formal_profile }}
        run: node scripts/runner-v2/formal-count-control.mjs sessions
      - name: Preserve healthy count allocation and bind reviewed runtime
        if: inputs.operation == 'refresh-count-runtime'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ (inputs.runtime_profile == 'count-runtime-rhino-measurement-20261001.json' || inputs.runtime_profile == 'count-runtime-rhino-two-observation-20261001.json' || inputs.runtime_profile == 'count-runtime-rhino-continuous-20261001.json' || inputs.runtime_profile == 'count-runtime-rhino-ag-continuation-20261001.json' || inputs.runtime_profile == 'count-runtime-rhino-ag-continuation-entryfix-20261001.json' || inputs.runtime_profile == 'count-runtime-rhino-ag-dispatchfix-20261001.json') && inputs.formal_profile || inputs.repair_profile }}
          SG_COUNT_RUNTIME_PROFILE: ${{ inputs.runtime_profile != 'none' && inputs.runtime_profile || '' }}
        run: node scripts/runner-v2/formal-count-control.mjs refresh
      - name: Isolate interrupted pilot and close its unused allowance without source requests
        if: inputs.operation == 'close-interrupted-pilot'
        env:
          SG_DEMO_PILOT_PROFILE: ${{ inputs.pilot_profile || 'demo-pilot-morepuff-20260930.json' }}
        run: node scripts/runner-v2/demo-interrupted-close-control.mjs
      - name: Activate independently reviewed complete-count permission without source requests
        if: inputs.operation == 'activate-formal-count'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ inputs.formal_profile || 'formal-count-pearl-20260930.json' }}
        run: node scripts/runner-v2/formal-count-control.mjs activate
      - name: Bind corrected runtime after failed admission without changing allocation
        if: inputs.operation == 'amend-formal-runtime'
        env:
          SG_FORMAL_COUNT_PROFILE: formal-count-pearl-20260930.json
        run: node scripts/runner-v2/formal-count-control.mjs amend
      - name: Settle a parked formal pool without new source permission
        if: inputs.operation == 'retire-stopped-formal'
        env:
          SG_FORMAL_RETIRE_PROFILE: ${{ inputs.retire_profile || 'formal-retire-pearl-20260930.json' }}
        run: node scripts/runner-v2/formal-stopped-retire-control.mjs
      - name: Return a repaired game with preserved complete counts and fresh session admission
        if: inputs.operation == 'activate-formal-repair'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ inputs.repair_profile || 'formal-repair-pearl-20260930.json' }}
        run: node scripts/runner-v2/formal-count-control.mjs repair
      - name: Retire a reviewed adapter-only shared stop and close its unused allowance
        if: inputs.operation == 'close-reviewed-adapter-stop'
        env:
          SG_DEMO_PILOT_PROFILE: demo-pilot-mansion-20260930.json
        run: node scripts/runner-v2/ag-shared-stop-control.mjs
      - name: Close unused finite pilot allowance without source requests
        if: inputs.operation == 'close-pilot'
        run: node scripts/runner-v2/demo-pilot-close-control.mjs
      - name: Fence the unstarted run and activate the bounded fresh generation
        if: inputs.operation == 'rollover'
        run: node scripts/runner-v2/demo-maintenance-control.mjs
      - name: Retire the interrupted attempt from the finished pilot without source requests
        if: inputs.operation == 'retire-finished'
        run: node scripts/runner-v2/retire-finished-demo-control.mjs
      - name: Activate only the original pilot's unspent BET budget with a new demo generation
        if: inputs.operation == 'residual'
        run: node scripts/runner-v2/demo-residual-control.mjs

      - name: Retire the next game and activate its independent finite demo generation
        if: inputs.operation == 'next-game'
        env:
          SG_DEMO_PILOT_PROFILE: ${{ inputs.pilot_profile || 'demo-pilot-morepuff-20260930.json' }}
        run: node scripts/runner-v2/demo-next-game-control.mjs
      - name: Bind reviewed runtime after independently verified zero source requests
        if: inputs.operation == 'rebind-zero-source'
        run: node scripts/runner-v2/demo-zero-source-control.mjs

  secondary-idle:
    if: github.repository == '287113535qq-cmyk/sg-capture-runner' && (((inputs.operation == 'secondary-idle' || inputs.operation == 'secondary-close-interrupted') && inputs.pilot_profile == 'demo-pilot-inca-20261001.json') || ((inputs.operation == 'secondary-next' || inputs.operation == 'secondary-close-interrupted') && inputs.pilot_profile == 'demo-pilot-pyramids-20261001.json'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
      SG_DEMO_PILOT_PROFILE: ${{ inputs.pilot_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted secondary database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked parser dependencies
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Import retire and activate the independent idle secondary candidate
        if: inputs.operation == 'secondary-idle'
        run: node scripts/runner-v2/secondary-idle-control.mjs activate
      - name: Close interrupted secondary pilot and place its evidence in the zero-source repair queue
        if: inputs.operation == 'secondary-close-interrupted' && inputs.pilot_profile == 'demo-pilot-inca-20261001.json'
        run: node scripts/runner-v2/secondary-idle-control.mjs close-interrupted
      - name: Close interrupted Pyramids pilot without reusing unspent allowance
        if: inputs.operation == 'secondary-close-interrupted' && inputs.pilot_profile == 'demo-pilot-pyramids-20261001.json'
        run: node scripts/runner-v2/secondary-next-control.mjs close-interrupted
      - name: Import retire and switch the closed secondary source to Pyramids
        if: inputs.operation == 'secondary-next'
        run: node scripts/runner-v2/secondary-next-control.mjs activate

  pyramids-count:
    if: github.repository == '287113535qq-cmyk/sg-capture-runner' && inputs.operation == 'activate-pyramids-count' && inputs.formal_profile == 'formal-count-pyramids-20261001.json'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
      SG_FORMAL_COUNT_PROFILE: formal-count-pyramids-20261001.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted secondary database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked parser dependency
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve historical and pilot records and activate remaining complete count
        run: node scripts/runner-v2/pyramids-count-control.mjs activate

  pyramids-repair:
    if: github.repository == '287113535qq-cmyk/sg-capture-runner' && ((inputs.operation == 'retire-pyramids-repair' && (inputs.retire_profile == 'formal-retire-pyramids-coins-20261001.json' || inputs.retire_profile == 'formal-retire-pyramids-display-20261001.json' || inputs.retire_profile == 'formal-retire-pyramids-display-entryfix-20261001.json' || (inputs.retire_profile == 'formal-retire-pyramids-continuation-20261001.json' || inputs.retire_profile == 'formal-retire-pyramids-continuation-entryfix-20261001.json'))) || (inputs.operation == 'activate-pyramids-repair' && (inputs.repair_profile == 'formal-repair-pyramids-coins-20261001.json' || inputs.repair_profile == 'formal-repair-pyramids-display-20261001.json' || inputs.repair_profile == 'formal-repair-pyramids-continuation-20261001.json' || (inputs.repair_profile == 'formal-repair-pyramids-major-20261001.json' || inputs.repair_profile == 'formal-repair-pyramids-major-entryfix-20261001.json'))) || (inputs.operation == 'amend-pyramids-zero-runtime' && inputs.runtime_profile == 'count-runtime-pyramids-session-20261001.json'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted secondary database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked parser dependency
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Settle stopped Pyramids without new source requests
        if: inputs.operation == 'retire-pyramids-repair'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ (inputs.retire_profile == 'formal-retire-pyramids-continuation-20261001.json' || inputs.retire_profile == 'formal-retire-pyramids-continuation-entryfix-20261001.json') && 'formal-repair-pyramids-continuation-20261001.json' || (inputs.retire_profile == 'formal-retire-pyramids-display-20261001.json' || inputs.retire_profile == 'formal-retire-pyramids-display-entryfix-20261001.json' || (inputs.retire_profile == 'formal-retire-pyramids-continuation-20261001.json' || inputs.retire_profile == 'formal-retire-pyramids-continuation-entryfix-20261001.json')) && 'formal-repair-pyramids-display-20261001.json' || 'formal-count-pyramids-20261001.json' }}
          SG_FORMAL_RETIRE_PROFILE: ${{ inputs.retire_profile }}
        run: node scripts/runner-v2/pyramids-repair-control.mjs retire
      - name: Return repaired Pyramids with preserved counts and fresh session admission
        if: inputs.operation == 'activate-pyramids-repair'
        env:
          SG_FORMAL_COUNT_PROFILE: ${{ inputs.repair_profile }}
        run: node scripts/runner-v2/pyramids-repair-control.mjs activate
      - name: Bind corrected runtime after verified zero registration
        if: inputs.operation == 'amend-pyramids-zero-runtime'
        env:
          SG_FORMAL_COUNT_PROFILE: formal-repair-pyramids-coins-20261001.json
          SG_COUNT_RUNTIME_PROFILE: ${{ inputs.runtime_profile != 'none' && inputs.runtime_profile || '' }}
        run: node scripts/runner-v2/pyramids-zero-runtime-control.mjs amend

  finalize-ended-source:
    if: github.repository == '287113535qq-cmyk/sg-capture-runner' && inputs.operation == 'finalize-ended-source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
      SG_ENDED_SOURCE_RUN: ${{ inputs.ended_source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Finish ended source parking without starting any game
        run: node scripts/runner-v2/ended-source-finalize-control.mjs

  count-shared-close:
    if: inputs.operation == 'close-count-shared'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted database transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked parser dependency
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Settle reviewed shared stop without source requests
        run: node scripts/runner-v2/count-shared-close-control.mjs

  revoke-rhino-jobless:
    if: github.repository == 'zyzuoyang/sg-capture-runner' && inputs.operation == 'revoke-rhino-jobless'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SG_SSH_HOST: ${{ secrets.SG_LINK_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure restricted transport
        run: node scripts/link/setup-ssh.mjs
        env:
          SG_SSH_PRIVATE_KEY: ${{ secrets.SG_LINK_SSH_PRIVATE_KEY }}
          SG_SSH_KNOWN_HOSTS: ${{ secrets.SG_LINK_SSH_KNOWN_HOSTS }}
      - name: Install locked dependencies
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Revoke the exact never-admitted jobless run without source or quota changes
        run: node scripts/runner-v2/count-jobless-fence-control.mjs
