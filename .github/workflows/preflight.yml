name: SG offline preflight
on:
  workflow_dispatch:
    inputs:
      compare_preflight:
        description: Compare the same offline checks in reversed serial/parallel order
        type: boolean
        default: false
      check_workers:
        description: Fixed independent offline check groups; no capture lanes
        type: choice
        options: ['1', '2', '3']
        default: '1'
permissions:
  contents: read
concurrency:
  group: sg-preparation
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.compare_preflight && 20 || 10 }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout preparation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        working-directory: collector
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Per-game rule archive matches committed implementation
        run: python3 scripts/build-game-rule-archive.py --check
      - name: Fixed offline checks with joined results and bounded concurrency
        env:
          SG_PREFLIGHT_COMPARE: ${{ inputs.compare_preflight && 'true' || 'false' }}
          SG_PREFLIGHT_WORKERS: ${{ inputs.check_workers || '1' }}
        run: |
          if [ "$SG_PREFLIGHT_COMPARE" = true ]; then
            python3 scripts/run_offline_preflight.py --compare
          else
            python3 scripts/run_offline_preflight.py --workers "$SG_PREFLIGHT_WORKERS"
          fi
      - name: Report preparation boundary
        run: |
          echo 'Offline preparation checks passed. No SG source request or database connection was made.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This preflight did not change capture or scheduled collection settings.' >> "$GITHUB_STEP_SUMMARY"
